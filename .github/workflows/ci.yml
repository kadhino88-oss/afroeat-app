name: Expo App CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed payment integration files
        run: npx eslint app/payment.js app/checkout.js services/stripeService.js services/stripeService.web.js constants/api.js app.config.js scripts/check-app-config.js
      - name: Test production environment guards
        run: npm run check:config
      - name: Export web bundle
        run: npx expo export --platform web
