name: Expo App CI

on:
  push:
    branches: [main, "fix/**", "sync/**"]
  pull_request:
    branches: [main, "sync/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Stripe wallet configuration safeguards
        run: npm run check:wallet-config
      - name: Test API URL environment safeguards
        run: npm run check:api-config
      - name: Validate translations
        run: npm run check:locales
      - name: Lint payment and dynamic app configuration
        run: npx eslint app.config.js constants/apiConfig.js scripts/api-config.test.cjs app/payment.js app/checkout.js app/account/payouts.js app/admin/payouts.js app/admin/index.js app/admin/_layout.js app/livraison/profile.js app/restaurant/restaurant-profile.js services/stripeService.js services/stripeService.web.js services/stripeConnectService.js constants/api.js
      - name: Export web bundle
        run: npx expo export --platform web
