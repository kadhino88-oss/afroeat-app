name: Expo App CI

on:
  push:
    branches: [main, "fix/**", "sync/**", "migration/**"]
  pull_request:
    branches: [main, "sync/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo SDK dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
      - name: Validate native iOS and Android project generation
        run: npx expo prebuild --no-install --platform all
      - name: Audit production dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Check Stripe wallet configuration safeguards
        run: npm run check:wallet-config
      - name: Test API URL environment safeguards
        run: npm run check:api-config
      - name: Test mobile/backend cash payment route compatibility
        run: npm run check:payment-route-sync
      - name: Validate translations
        run: npm run check:locales
      - name: Test Explore national cuisine filters
        run: npm run check:explore-cuisines
      - name: Test persisted restaurant settings
        run: npm run check:restaurant-settings
      - name: Test catalog business type filters
        run: npm run check:catalog-business-type
      - name: Lint payment and dynamic app configuration
        run: npx eslint app.config.js constants/apiConfig.js scripts/api-config.test.cjs app/payment.js app/checkout.js app/account/payouts.js app/admin/payouts.js app/admin/index.js app/admin/_layout.js app/livraison/profile.js app/restaurant/restaurant-profile.js services/stripeService.js services/stripeService.web.js services/stripeConnectService.js constants/api.js scripts/payment-route-sync.test.cjs app/map.js app/profile/payment.js 'app/(tabs)/explore.js' 'app/(tabs)/index.js' 'app/restaurant/[id].js'
      - name: Export web bundle
        run: npx expo export --platform web
