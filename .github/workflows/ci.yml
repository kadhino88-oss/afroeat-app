name: Expo App CI

on:
  push:
    branches: [main, "fix/**", "sync/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Stripe wallet configuration safeguards
        run: npm run check:wallet-config
      - name: Lint payment and dynamic app configuration
        run: npx eslint app.config.js app/payment.js app/checkout.js services/stripeService.js services/stripeService.web.js constants/api.js
      - name: Export web bundle
        run: npx expo export --platform web
