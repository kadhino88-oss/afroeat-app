name: État d'une construction mobile (EAS)

# Bouton manuel : affiche l'état d'une construction Expo (statut, erreur, lien de téléchargement)
# à partir de son identifiant (la fin de l'adresse expo.dev/.../builds/<identifiant>).
# Secret requis : EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Identifiant de la construction (fin de l'adresse expo.dev …/builds/<identifiant>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Afficher l'état
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if ! [[ "$BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Identifiant de construction invalide."
            exit 1
          fi
          eas build:view "$BUILD_ID" --json > build.json
          node -e '
            const b = require("./build.json");
            const pick = { statut: b.status, plateforme: b.platform, profil: b.buildProfile, version: b.appVersion,
              build: b.appBuildVersion, creation: b.createdAt, fin: b.completedAt,
              erreur: b.error ? `${b.error.errorCode || ""} ${b.error.message || ""}`.trim() : "",
              telechargement: b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || "",
              journaux: b.logFiles?.length ? `${b.logFiles.length} fichier(s) de journal` : "" };
            for (const [k, v] of Object.entries(pick)) if (v) console.log(`${k}: ${v}`);
            require("fs").writeFileSync("logs.txt", (b.logFiles || []).map((u) => u + "\n").join(""));
          '
          # En cas d'échec : extraits utiles du journal de construction (erreurs Gradle / Xcode).
          if grep -q '"status": *"ERRORED"' build.json; then
            i=0
            while read -r url; do
              [ -z "$url" ] && continue
              i=$((i+1))
              curl -sL --compressed "$url" -o "log$i.raw" || continue
              # Journal EAS : une ligne JSON par message (champ « msg »), parfois compressé.
              (gzip -dc "log$i.raw" 2>/dev/null || cat "log$i.raw") > "log$i.jsonl"
              node -e '
                const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
                const msgs = lines.map((l) => { try { const j = JSON.parse(l); return (j.phase ? `[${j.phase}] ` : "") + (j.msg || ""); } catch { return l; } }).filter(Boolean);
                const real = msgs.filter((m) => !m.startsWith("[ON_BUILD_ERROR_HOOK]"));
      const hits = real.filter((m) => /What went wrong|FAILURE|error:|Error:|ERROR|Missing class|R8|Could not|FAILED|Execution failed|Caused by|Cannot|not found|invalid/i.test(m));
                console.log(`----- Journal ${process.argv[2]} : ${msgs.length} lignes, ${hits.length} lignes d’erreur -----`);
                (hits.length ? hits.slice(-60) : real.slice(-40)).forEach((m) => console.log(m.slice(0, 400)));
              ' "log$i.jsonl" "$i"
            done < logs.txt
            exit 1
          fi
