name: Regenerate Expo SDK 58 lockfile

on:
  push:
    branches: ["migration/expo-sdk58-reference"]
    paths:
      - "package.json"
      - ".github/workflows/regenerate-sdk58-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: migration/expo-sdk58-reference
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): regenerate Expo SDK 58 lockfile"
            git push origin HEAD:migration/expo-sdk58-reference
          fi
      - name: Verify clean reproducible installation
        run: npm ci
      - name: Validate Expo dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run application regression checks
        run: |
          npm run check:wallet-config
          npm run check:api-config
          npm run check:payment-route-sync
          npm run check:locales
          npm run check:explore-cuisines
          npm run check:restaurant-settings
          npm run check:catalog-business-type
      - name: Lint production-critical app flows
        run: npx eslint app.config.js constants/apiConfig.js scripts/api-config.test.cjs app/payment.js app/checkout.js app/account/payouts.js app/admin/payouts.js app/admin/index.js app/admin/_layout.js app/livraison/profile.js app/restaurant/restaurant-profile.js services/stripeService.js services/stripeService.web.js services/stripeConnectService.js constants/api.js scripts/payment-route-sync.test.cjs app/map.js app/profile/payment.js 'app/(tabs)/explore.js' 'app/(tabs)/index.js' 'app/restaurant/[id].js'
      - name: Export web bundle
        run: npx expo export --platform web
