name: Regenerate Expo SDK 58 lockfile

on:
  push:
    branches:
      - migration/expo-sdk58-reference
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: migration/expo-sdk58-reference
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependencies and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile root matches package manifest
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(l.lockfileVersion!==3||l.packages[''].dependencies.expo!==p.dependencies.expo||l.packages[''].dependencies['react-native']!==p.dependencies['react-native'])process.exit(1)"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore(migration): regenerate Expo SDK 58 lockfile"
            git push origin migration/expo-sdk58-reference
          fi
