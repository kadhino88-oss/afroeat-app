version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Les versions de ces paquets sont imposées par Expo SDK 58 : elles ne changent
    # que lors d'une montée de SDK (« npx expo install --fix »), pas par mise à jour automatique.
    # Les mises à jour de version majeure (ex. ESLint 10, TypeScript 7) sont aussi exclues :
    # elles demandent une migration volontaire.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "typescript"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
